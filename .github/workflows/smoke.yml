name: Smoke test Minecraft 26.3 world registries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'gradle.properties'
      - 'build.gradle'
      - '.github/workflows/smoke.yml'
permissions:
  contents: read
jobs:
  headless-server:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate all assets and dimension data
        run: |
          python3 tools/generate_assets.py
          python3 tools/generate_worldgen.py
          python3 tools/generate_tide.py
          python3 tools/check_assets.py
          python3 tools/check_worldgen.py
      - name: Start Minecraft server and parse custom dimension registries
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nenable-rcon=true\nrcon.port=25575\nrcon.password=sift-ci-only\nlevel-seed=42819\n" > run/server.properties
          gradle --no-daemon runServer --args='nogui' > /tmp/sift-server-stdout.log 2>&1 &
          PID=$!
          ready=0
          for i in $(seq 1 185); do
            if grep -Fq 'Done (' /tmp/sift-server-stdout.log run/logs/latest.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 100 /tmp/sift-server-stdout.log || true
            if [ -f run/logs/latest.log ]; then tail -n 80 run/logs/latest.log; fi
            kill "$PID" 2>/dev/null || true
            echo "Server did not finish startup. Check errors above." >&2
            exit 1
          fi
          python3 tools/server_smoke_rcon.py || {
            tail -n 100 /tmp/sift-server-stdout.log || true
            if [ -f run/logs/latest.log ]; then tail -n 80 run/logs/latest.log; fi
            kill "$PID" 2>/dev/null || true
            exit 1
          }
          kill "$PID" 2>/dev/null || true
          echo "PASS: Minecraft server accepted Sift registries and generated an actual Sift chunk"
  visual-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install software OpenGL and capture tools
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils mesa-vulkan-drivers vulkan-tools libflite1 xdotool imagemagick
      - name: Prepare client and server
        run: |
          python3 tools/generate_assets.py
          python3 tools/generate_worldgen.py
          python3 tools/generate_tide.py
          gradle --no-daemon classes
          mkdir -p run/visual
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nwhite-list=false\nenforce-secure-profile=false\nenable-rcon=true\nrcon.port=25575\nrcon.password=sift-ci-only\nlevel-seed=42819\nview-distance=7\n' > run/server.properties
          printf 'renderDistance:7\nsimulationDistance:5\nmaxFps:30\nfullscreen:false\nguiScale:2\n' > run/options.txt
      - name: Launch real Minecraft window and verify rendering
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          SDL_VIDEO_DRIVER: x11
          ALSOFT_DRIVERS: 'null'
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 2
          glxinfo -B > run/visual/opengl-info.log 2>&1 || true
          vulkaninfo --summary > run/visual/vulkan-info.log 2>&1 || true
          gradle --no-daemon runServer --args='nogui' > run/visual/server-console.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" "$CLIENT_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 200); do
            if grep -Fq 'Done (' run/visual/server-console.log; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -n 100 run/visual/server-console.log; exit 1; fi
          gradle --no-daemon runClient --args='--username SiftVisualTest --width 1280 --height 720 --quickPlayMultiplayer localhost:25565' > run/visual/client-console.log 2>&1 &
          CLIENT_PID=$!
          timeout 330 python3 tools/client_visual_check.py
      - name: Save actual client frames and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sift-0.5.4-client-verification
          path: |
            run/visual
            run/logs
            run/crash-reports
