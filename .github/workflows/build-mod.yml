name: Build THE SIFT Fabric JAR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/smoke.yml', 'tools/server_smoke_rcon.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate original textures, models and initial biome data
        run: python3 tools/generate_assets.py
      - name: Generate dedicated rift world and iridescent tide
        run: |
          python3 tools/generate_worldgen.py
          python3 tools/generate_tide.py
      - name: Validate generated resource files
        run: |
          python3 tools/check_assets.py
          python3 tools/check_worldgen.py
      - name: Compile with Fabric Loom
        run: gradle --no-daemon clean build
      - name: Inspect resolved client fluid API
        run: |
          python3 - <<'PY'
          import os,zipfile,subprocess
          from pathlib import Path
          for root in (Path.home()/'.gradle/caches',Path('.gradle')):
              for jar in root.rglob('*.jar'):
                  try:
                      with zipfile.ZipFile(jar) as z:
                          if 'net/minecraft/client/color/block/BlockTintSource.class' not in z.namelist():continue
                      for cls in ('net.minecraft.client.color.block.BlockTintSource',
                                  'net.minecraft.client.color.block.BlockTintSources',
                                  'net.minecraft.client.renderer.block.FluidModel',
                                  'net.fabricmc.fabric.api.client.rendering.v1.BlockRenderLayerMap'):
                          subprocess.run(['javap','-classpath',str(jar),cls],check=False)
                      raise SystemExit(0)
                  except zipfile.BadZipFile:pass
          PY
      - name: Publish compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: the-sift-0.5.4-jar
          path: build/libs/the-sift-0.5.4.jar
          if-no-files-found: error
      - name: Save generated game assets to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources
          if ! git diff --cached --quiet; then
            git commit -m "Generate original Sift assets and initial dimension data"
            git push
          fi
